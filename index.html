<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXOTIC GB HUB | Welcome</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f2f9fc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    #aquariumCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* ==========================================================================
       WELCOME OVERLAY & ENTER BUTTON
       ========================================================================== */
    .welcome-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none; /* Allows mouse interaction with canvas behind it except for clickable elements */
      padding: 20px;
    }

    .welcome-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      padding: 50px 60px;
      text-align: center;
      box-shadow: 0 20px 50px -10px rgba(139, 92, 246, 0.15), 0 0 30px rgba(6, 182, 212, 0.15);
      pointer-events: auto; /* Re-enables clicking on the card contents */
      animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-width: 600px;
      width: 100%;
    }

    @keyframes cardEntry {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 18px auto;
      background: linear-gradient(135deg, #ff007f, #7928ca, #0070f3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.8rem;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
    }

    .welcome-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 35%, #06b6d4 70%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .welcome-sub {
      font-size: 1.02rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .btn-enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
      color: #ffffff;
      padding: 16px 42px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 1.05rem;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(236, 72, 153, 0.4);
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .btn-enter:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 16px 36px rgba(139, 92, 246, 0.5);
    }

    @media (max-width: 600px) {
      .welcome-card { padding: 35px 24px; }
      .welcome-title { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <!-- Interactive Background Canvas -->
  <canvas id="aquariumCanvas"></canvas>

  <!-- Welcome Overlay & Enter Button -->
  <div class="welcome-overlay">
    <div class="welcome-card">
      <div class="brand-icon">
        <i class="fa-solid fa-fish-fins"></i>
      </div>
      <h1 class="welcome-title">EXOTIC GB HUB</h1>
      <p class="welcome-sub">Explore rare ornamental freshwater and marine life, crystal rimless tanks, and high-end aquascaping essentials.</p>
      
      <a href="dashboard.html" class="btn-enter">
        Enter Store <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("aquariumCanvas");
    const ctx = canvas.getContext("2d");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initAll();
    });

    let time = 0;

    // ==========================================
    // DATA STRUCTURES
    // ==========================================

    // Style 1: Bubbles
    let bubbles = [];
    function initBubbles() {
      bubbles = [];
      const count = Math.floor(width / 24);
      for (let i = 0; i < count; i++) {
        bubbles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 8 + 3,
          speed: Math.random() * 1.1 + 0.5,
          wobbleSpeed: Math.random() * 0.035 + 0.02,
          wobbleAmp: Math.random() * 16 + 6,
          wobbleSeed: Math.random() * 100,
          opacity: Math.random() * 0.35 + 0.3
        });
      }
    }

    // Style 4: Translucent Jellies
    let jellies = [];
    function initJellies() {
      jellies = [];
      const count = Math.max(4, Math.floor(width / 260));
      for (let i = 0; i < count; i++) {
        jellies.push({
          x: Math.random() * (width - 120) + 60,
          y: Math.random() * height,
          size: Math.random() * 26 + 22,
          speed: Math.random() * 0.42 + 0.28,
          pulseRate: Math.random() * 0.03 + 0.02,
          seed: Math.random() * Math.PI * 2,
          tentacles: 5
        });
      }
    }

    // Style 5: Kelp & Floating Glints
    let kelpStalks = [];
    let sunGlints = [];
    function initKelpAndGlints() {
      kelpStalks = [];
      const stalkCount = Math.floor(width / 55) + 4;
      for (let i = 0; i < stalkCount; i++) {
        kelpStalks.push({
          x: i * (width / stalkCount) + (Math.random() * 20 - 10),
          baseWidth: Math.random() * 8 + 6,
          height: Math.random() * (height * 0.12) + height * 0.10,
          segments: 8,
          speed: Math.random() * 0.025 + 0.015,
          phase: Math.random() * Math.PI * 2,
          color: i % 2 === 0 ? "rgba(43, 147, 137, 0.35)" : "rgba(30, 126, 120, 0.22)"
        });
      }

      sunGlints = [];
      for (let i = 0; i < 45; i++) {
        sunGlints.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2.2 + 1.2,
          speedY: Math.random() * 0.3 + 0.1,
          speedX: Math.random() * 0.3 - 0.15,
          alpha: Math.random() * 0.45 + 0.2
        });
      }
    }

    function initAll() {
      initBubbles();
      initJellies();
      initKelpAndGlints();
    }

    // ==========================================
    // RENDER FUNCTIONS
    // ==========================================

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, "#f4fafc");
      grad.addColorStop(0.5, "#e1f3f7");
      grad.addColorStop(0.85, "#cdecf1");
      grad.addColorStop(1, "#c2e6de");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
    }

    function drawGlints() {
      sunGlints.forEach(p => {
        p.x += p.speedX;
        p.y -= p.speedY;

        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.restore();
      });
    }

    function drawJellies() {
      jellies.forEach(j => {
        const pulse = Math.sin(time * j.pulseRate + j.seed);
        const contraction = 1 + pulse * 0.22;
        j.y -= j.speed * (1 + pulse * 0.4);

        if (j.y + j.size * 3 < 0) {
          j.y = height + j.size * 2;
          j.x = Math.random() * (width - 120) + 60;
        }

        ctx.save();
        ctx.translate(j.x, j.y);

        ctx.beginPath();
        ctx.arc(0, 0, j.size * contraction, Math.PI, 0, false);
        ctx.bezierCurveTo(j.size * 0.5, j.size * 0.25, -j.size * 0.5, j.size * 0.25, -j.size * contraction, 0);
        ctx.fillStyle = "rgba(14, 165, 233, 0.12)";
        ctx.strokeStyle = "rgba(2, 132, 199, 0.4)";
        ctx.lineWidth = 1.4;
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -2, j.size * 0.58 * contraction, Math.PI, 0, false);
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        ctx.fill();

        ctx.lineWidth = 1.1;
        ctx.strokeStyle = "rgba(2, 132, 199, 0.25)";
        for (let t = -j.tentacles / 2; t <= j.tentacles / 2; t++) {
          const startX = (t / (j.tentacles / 2)) * (j.size * 0.65);
          ctx.beginPath();
          ctx.moveTo(startX, 0);

          const tLen = j.size * 2.1;
          const wave1 = Math.sin(time * 0.05 + t) * 9;
          const wave2 = Math.cos(time * 0.04 + t) * 12;

          ctx.bezierCurveTo(startX + wave1, tLen * 0.4, startX - wave2, tLen * 0.7, startX + wave1, tLen);
          ctx.stroke();
        }

        ctx.restore();
      });
    }

    function drawBubbles() {
      bubbles.forEach(b => {
        b.y -= b.speed;
        const currentX = b.x + Math.sin(time * b.wobbleSpeed + b.wobbleSeed) * b.wobbleAmp;

        if (b.y + b.radius < 0) {
          b.y = height + b.radius + 10;
          b.x = Math.random() * width;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(currentX, b.y, b.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(14, 165, 233, ${b.opacity * 0.6})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.fillStyle = `rgba(255, 255, 255, ${b.opacity * 0.45})`;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(currentX - b.radius * 0.35, b.y - b.radius * 0.35, b.radius * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fill();
        ctx.restore();
      });
    }

    function drawReducedKelp() {
      kelpStalks.forEach(k => {
        ctx.save();
        ctx.fillStyle = k.color;
        ctx.beginPath();

        const segLen = k.height / k.segments;
        ctx.moveTo(k.x - k.baseWidth / 2, height);

        for (let s = 1; s <= k.segments; s++) {
          const sway = Math.sin(time * k.speed + k.phase + s * 0.35) * (s * 2.2);
          const currentY = height - s * segLen;
          const currentWidth = k.baseWidth * (1 - s / (k.segments * 1.25));
          ctx.lineTo(k.x + sway - currentWidth / 2, currentY);
        }

        const tipSway = Math.sin(time * k.speed + k.phase + k.segments * 0.35) * (k.segments * 2.2);
        ctx.lineTo(k.x + tipSway, height - k.height);

        for (let s = k.segments; s >= 1; s--) {
          const sway = Math.sin(time * k.speed + k.phase + s * 0.35) * (s * 2.2);
          const currentY = height - s * segLen;
          const currentWidth = k.baseWidth * (1 - s / (k.segments * 1.25));
          ctx.lineTo(k.x + sway + currentWidth / 2, currentY);
        }

        ctx.lineTo(k.x + k.baseWidth / 2, height);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });
    }

    // ==========================================
    // MAIN ANIMATION LOOP
    // ==========================================

    function animate() {
      time += 1;

      drawBackground();
      drawGlints();
      drawJellies();
      drawBubbles();
      drawReducedKelp();

      requestAnimationFrame(animate);
    }

    initAll();
    animate();
  </script>
</body>
</html>

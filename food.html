<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fish Food & Nutrition | EXOTIC GB HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-primary: #fafcff;
      --bg-gradient: linear-gradient(180deg, #fff5f8 0%, #fef3c7 35%, #ffffff 100%);
      --text-main: #0f172a; --text-muted: #64748b; --primary-blue: #0284c7;
      --glass-bg: rgba(255, 255, 255, 0.84); --glass-border: rgba(255, 255, 255, 0.95);
      --card-radius: 24px; --transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-primary); background-image: var(--bg-gradient); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    /* EXACT DASHBOARD MATCHING FLOATING NAVBAR */
    .nav-container {
      position: sticky;
      top: 20px;
      z-index: 1000;
      margin: 20px auto 30px auto;
      max-width: 1340px;
      padding: 0 24px;
    }
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid var(--glass-border);
      border-radius: 22px;
      padding: 12px 28px;
      box-shadow: 0 12px 35px -8px rgba(245, 158, 11, 0.08);
      transition: var(--transition);
    }
    .nav-left { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.35rem; }
    .nav-middle { flex: 1; max-width: 480px; margin: 0 15px; }
    .search-box { display: flex; align-items: center; background: rgba(248, 250, 252, 0.9); border-radius: 999px; padding: 9px 20px; border: 2px solid transparent; }
    .search-box:focus-within { background: #ffffff; border-color: #f59e0b; }
    .search-box i { color: #d97706; margin-right: 12px; }
    .search-box input { border: none; background: transparent; outline: none; width: 100%; font-size: 0.94rem; font-weight: 600; }
    .nav-right { display: flex; align-items: center; }
    .profile-avatar-logged-in { width: 44px; height: 44px; border-radius: 50%; background: var(--primary-blue); color: white; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid white; }
    .profile-icon-logged-out { width: 44px; height: 44px; border-radius: 50%; background: #fef3c7; color: #d97706; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; text-decoration: none; border: 1.5px solid #fde68a; }

    .main-wrapper { max-width: 1340px; margin: 0 auto; padding: 0 24px 80px 24px; position: relative; z-index: 2; }

    .master-banner { height: 380px; border-radius: var(--card-radius); overflow: hidden; margin-bottom: 40px; background: url('https://images.unsplash.com/photo-1628102491629-778571d893a3?auto=format&fit=crop&w=1600&q=80') center/cover; position: relative; display: flex; align-items: center; }
    .banner-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(15, 23, 42, 0.88) 0%, rgba(15, 23, 42, 0.4) 100%); display: flex; align-items: center; padding: 0 50px; }
    .tag-badge { padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 800; text-transform: uppercase; margin-right: 8px; }
    .tag-limited { background: #ef4444; color: white; }
    .tag-golden { background: #eab308; color: white; }
    .tag-premium { background: #8b5cf6; color: white; }
    .tag-offer { background: #10b981; color: white; }

    .products-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
    .product-card { background: var(--glass-bg); backdrop-filter: blur(16px); border: 2px solid var(--glass-border); border-radius: var(--card-radius); padding: 18px; display: flex; flex-direction: column; transition: var(--transition); }
    .product-card:hover { transform: translateY(-8px); border-color: #f59e0b; }
    .product-img-wrapper { width: 100%; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
    .product-img { width: 100%; height: 100%; object-fit: cover; }
    .product-name { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.25rem; margin-bottom: 6px; }
    .product-price { font-size: 1.4rem; font-weight: 800; color: #d97706; margin-bottom: 14px; }
    .controls-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: #f8fafc; padding: 8px 12px; border-radius: 14px; border: 1px solid #e2e8f0; }
    .qty-selector { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: none; background: #fff; font-weight: 800; cursor: pointer; }
    .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
    .btn-card { padding: 11px; border-radius: 999px; font-weight: 800; font-size: 0.9rem; cursor: pointer; border: none; text-align: center; }
    .btn-add-cart { background: #f1f5f9; border: 1.5px solid #cbd5e1; }
    .btn-buy-now { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }

    .floating-cart-btn { position: fixed; bottom: 28px; right: 28px; width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; text-decoration: none; z-index: 9999; }
    .cart-badge-count { position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; font-size: 0.8rem; font-weight: 800; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; }

    @media (max-width: 1024px) { .products-grid-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) {
      .navbar { flex-wrap: wrap; padding: 12px 18px; }
      .nav-middle { order: 3; flex: 100%; max-width: 100%; margin: 10px 0 0 0; }
      .products-grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="nav-container">
    <nav class="navbar">
      <a href="dashboard.html" class="nav-left">
        <div class="nav-logo-icon"><i class="fa-solid fa-bowl-food"></i></div>
        <div style="font-family:'Space Grotesk'; font-weight:800; font-size:1.35rem; color:#d97706;">EXOTIC GB HUB</div>
      </a>
      <div class="nav-middle">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search pellets, spirulina, baby brine shrimp..." />
        </div>
      </div>
      <div class="nav-right" id="profileContainer"></div>
    </nav>
  </header>

  <main class="main-wrapper">
    <div class="master-banner">
      <div class="banner-overlay">
        <div>
          <div>
            <span class="tag-badge tag-limited">Limited Edition</span>
            <span class="tag-badge tag-golden">Golden Edition</span>
            <span class="tag-badge tag-premium">Premium Edition</span>
            <span class="tag-badge tag-offer">Today Offer</span>
          </div>
          <h1 style="color:white; font-family:'Space Grotesk'; font-size:2.5rem; font-weight:800; margin:14px 0 10px 0;">Nutritional Diets & Color Enhancers</h1>
          <p style="color:#fde68a;">Formulated with fresh krill, astaxanthin, and immune stimulants for vibrant health.</p>
        </div>
      </div>
    </div>

    <h2 style="font-family:'Space Grotesk'; font-size:2rem; font-weight:800; margin-bottom:24px;">Nutrition & <span style="color:#d97706;">Feeds</span></h2>
    <div class="products-grid-3" id="foodContainer"></div>
  </main>

  <a href="cart.html" class="floating-cart-btn"><i class="fa-solid fa-cart-shopping"></i><span class="cart-badge-count" id="cartCountBadge">0</span></a>

  <script>
    const DEFAULT_FOOD = [
      { id: "fd1", name: "Discus High-Protein Growth Bits (250g)", price: 680, img: "https://images.unsplash.com/photo-1628102491629-778571d893a3?auto=format&fit=crop&w=800&q=80" },
      { id: "fd2", name: "Freeze-Dried Bloodworms & Tubifex Cubes", price: 450, img: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=800&q=80" },
      { id: "fd3", name: "Micro Slow-Sinking Nano Fish Pellets", price: 320, img: "https://images.unsplash.com/photo-1522069169874-c58ec4b76be5?auto=format&fit=crop&w=800&q=80" },
      { id: "fd4", name: "Spirulina Algae Wafers for Plecos & Shrimp", price: 380, img: "https://images.unsplash.com/photo-1535591273668-578e31182c4f?auto=format&fit=crop&w=800&q=80" },
      { id: "fd5", name: "Astaxanthin Red Booster Flakes", price: 540, img: "https://images.unsplash.com/photo-1524704654690-b56c05c78a00?auto=format&fit=crop&w=800&q=80" },
      { id: "fd6", name: "Decapsulated Brine Shrimp Eggs (Artemia)", price: 790, img: "https://images.unsplash.com/photo-1508873696983-2df5703bc20d?auto=format&fit=crop&w=800&q=80" }
    ];

    function getFoodItems() {
      const data = JSON.parse(localStorage.getItem('exotic_gb_data') || '{}');
      if (data.stocks && data.stocks.food) {
        return data.stocks.food.filter(f => f.isActive !== false);
      }
      return DEFAULT_FOOD;
    }

    const qtys = {};

    function renderFood() {
      const items = getFoodItems();
      items.forEach(f => { if (!qtys[f.id]) qtys[f.id] = 1; });

      document.getElementById('foodContainer').innerHTML = items.map(f => `
        <div class="product-card">
          <div class="product-img-wrapper"><img src="${f.img}" class="product-img" alt="${f.name}" /></div>
          <h3 class="product-name">${f.name}</h3>
          <div class="product-price">₹${f.price.toLocaleString('en-IN')}</div>
          <div class="controls-row">
            <span style="font-weight:700; color:var(--text-muted); font-size:0.9rem;">Pack Qty</span>
            <div class="qty-selector">
              <button class="qty-btn" onclick="updateQty('${f.id}', -1)">-</button>
              <span id="qty_${f.id}" style="font-weight:800;">1</span>
              <button class="qty-btn" onclick="updateQty('${f.id}', 1)">+</button>
            </div>
          </div>
          <div class="card-actions">
            <button class="btn-card btn-add-cart" onclick="addToCart('${f.id}')">Add Cart</button>
            <button class="btn-card btn-buy-now" onclick="buyNow('${f.id}')">Buy Now</button>
          </div>
        </div>
      `).join('');
    }

    function updateQty(id, delta) {
      if (qtys[id] + delta >= 1) { qtys[id] += delta; document.getElementById(`qty_${id}`).innerText = qtys[id]; }
    }

    function addToCart(id) {
      const items = getFoodItems();
      const item = items.find(f => f.id === id);
      const cart = JSON.parse(localStorage.getItem('exotic_cart') || '[]');
      const exist = cart.find(c => c.id === id);
      if (exist) exist.quantity += qtys[id];
      else cart.push({ id: item.id, name: item.name, category: "Fish Food", price: item.price, quantity: qtys[id], isPair: false, img: item.img });
      localStorage.setItem('exotic_cart', JSON.stringify(cart));
      updateBadge();
      alert(`Added ${item.name} to cart!`);
    }

    function buyNow(id) { addToCart(id); window.location.href = "cart.html"; }

    function updateBadge() {
      const cart = JSON.parse(localStorage.getItem('exotic_cart') || '[]');
      document.getElementById('cartCountBadge').innerText = cart.reduce((a, b) => a + b.quantity, 0);
    }

    function renderNavProfile() {
      const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
      document.getElementById('profileContainer').innerHTML = user && user.name 
        ? `<div class="profile-avatar-logged-in">${user.name.charAt(0).toUpperCase()}</div>`
        : `<a href="login.html" class="profile-icon-logged-out"><i class="fa-regular fa-user"></i></a>`;
    }

    document.addEventListener('DOMContentLoaded', () => { renderNavProfile(); renderFood(); updateBadge(); });
  </script>
</body>
</html>

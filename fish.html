  <style>

      --bg-gradient: linear-gradient(180deg, #fff5f8 0%, #f0fdf4 35%, #f0f9ff 70%, #ffffff 100%);
      --grad-rainbow-text: linear-gradient(135deg, #ec4899 0%, #8b5cf6 35%, #06b6d4 70%, #10b981 100%);

      gap: 8px;

      box-shadow: 0 10px 25px -4px rgba(236, 72, 153, 0.25), 0 4px 12px -2px rgba(139, 92, 246, 0.15);
      padding: 10px 20px;
      border-radius: 999px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 800;
      font-size: 0.88rem;
      transition: var(--transition);

    .floating-back-btn i { color: #ec4899; font-size: 0.95rem; }
    .floating-back-btn:hover {

    .nav-middle { flex: 1; max-width: 480px; margin: 0 15px; }

    .search-box {

    .nav-right { display: flex; align-items: center; }

    .cart-badge-count {

    }

    @media (max-width: 1024px) { .products-grid-3 { grid-template-columns: repeat(2, 1fr); gap: 20px; } }

    }
  </style>

  <!-- AQUARIUM CANVAS ANIMATION SCRIPT -->
  <script>
    const canvas = document.getElementById("aquariumCanvas");
    const ctx = canvas.getContext("2d");
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initAllCanvas();
    });

    let time = 0;
    let bubbles = [], jellies = [], kelpStalks = [], sunGlints = [];

    function initBubbles() {
      bubbles = [];
      const count = Math.floor(width / 24);
      for (let i = 0; i < count; i++) {
        bubbles.push({
          x: Math.random() * width, y: Math.random() * height,
          radius: Math.random() * 8 + 3, speed: Math.random() * 1.1 + 0.5,
          wobbleSpeed: Math.random() * 0.035 + 0.02, wobbleAmp: Math.random() * 16 + 6,
          wobbleSeed: Math.random() * 100, opacity: Math.random() * 0.35 + 0.3
        });
      }
    }

    function initJellies() {
      jellies = [];
      const count = Math.max(4, Math.floor(width / 260));
      for (let i = 0; i < count; i++) {
        jellies.push({
          x: Math.random() * (width - 120) + 60, y: Math.random() * height,
          size: Math.random() * 26 + 22, speed: Math.random() * 0.42 + 0.28,
          pulseRate: Math.random() * 0.03 + 0.02, seed: Math.random() * Math.PI * 2, tentacles: 5
        });
      }
    }

    function initKelpAndGlints() {
      kelpStalks = [];
      const stalkCount = Math.floor(width / 55) + 4;
      for (let i = 0; i < stalkCount; i++) {
        kelpStalks.push({
          x: i * (width / stalkCount) + (Math.random() * 20 - 10),
          baseWidth: Math.random() * 8 + 6,
          height: Math.random() * (height * 0.12) + height * 0.10,
          segments: 8, speed: Math.random() * 0.025 + 0.015,
          phase: Math.random() * Math.PI * 2,
          color: i % 2 === 0 ? "rgba(43, 147, 137, 0.35)" : "rgba(30, 126, 120, 0.22)"
        });
      }

      sunGlints = [];
      for (let i = 0; i < 45; i++) {
        sunGlints.push({
          x: Math.random() * width, y: Math.random() * height,
          radius: Math.random() * 2.2 + 1.2, speedY: Math.random() * 0.3 + 0.1,
          speedX: Math.random() * 0.3 - 0.15, alpha: Math.random() * 0.45 + 0.2
        });
      }
    }

    function initAllCanvas() { initBubbles(); initJellies(); initKelpAndGlints(); }

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, "#f4fafc");
      grad.addColorStop(0.5, "#e1f3f7");
      grad.addColorStop(0.85, "#cdecf1");
      grad.addColorStop(1, "#c2e6de");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
    }

    function drawGlints() {
      sunGlints.forEach(p => {
        p.x += p.speedX; p.y -= p.speedY;
        if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.restore();
      });
    }

    function drawJellies() {
      jellies.forEach(j => {
        const pulse = Math.sin(time * j.pulseRate + j.seed);
        const contraction = 1 + pulse * 0.22;
        j.y -= j.speed * (1 + pulse * 0.4);
        if (j.y + j.size * 3 < 0) { j.y = height + j.size * 2; j.x = Math.random() * (width - 120) + 60; }
        ctx.save();
        ctx.translate(j.x, j.y);
        ctx.beginPath();
        ctx.arc(0, 0, j.size * contraction, Math.PI, 0, false);
        ctx.bezierCurveTo(j.size * 0.5, j.size * 0.25, -j.size * 0.5, j.size * 0.25, -j.size * contraction, 0);
        ctx.fillStyle = "rgba(14, 165, 233, 0.12)";
        ctx.strokeStyle = "rgba(2, 132, 199, 0.4)";
        ctx.lineWidth = 1.4;
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -2, j.size * 0.58 * contraction, Math.PI, 0, false);
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        ctx.fill();

        ctx.lineWidth = 1.1;
        ctx.strokeStyle = "rgba(2, 132, 199, 0.25)";
        for (let t = -j.tentacles / 2; t <= j.tentacles / 2; t++) {
          const startX = (t / (j.tentacles / 2)) * (j.size * 0.65);
          ctx.beginPath();
          ctx.moveTo(startX, 0);
          const tLen = j.size * 2.1;
          const wave1 = Math.sin(time * 0.05 + t) * 9;
          const wave2 = Math.cos(time * 0.04 + t) * 12;
          ctx.bezierCurveTo(startX + wave1, tLen * 0.4, startX - wave2, tLen * 0.7, startX + wave1, tLen);
          ctx.stroke();
        }
        ctx.restore();
      });
    }

    function drawBubbles() {
      bubbles.forEach(b => {
        b.y -= b.speed;
        const currentX = b.x + Math.sin(time * b.wobbleSpeed + b.wobbleSeed) * b.wobbleAmp;
        if (b.y + b.radius < 0) { b.y = height + b.radius + 10; b.x = Math.random() * width; }
        ctx.save();
        ctx.beginPath();
        ctx.arc(currentX, b.y, b.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(14, 165, 233, ${b.opacity * 0.6})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.fillStyle = `rgba(255, 255, 255, ${b.opacity * 0.45})`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(currentX - b.radius * 0.35, b.y - b.radius * 0.35, b.radius * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fill();
        ctx.restore();
      });
    }

    function drawReducedKelp() {
      kelpStalks.forEach(k => {
        ctx.save();
        ctx.fillStyle = k.color;
        ctx.beginPath();
        const segLen = k.height / k.segments;
        ctx.moveTo(k.x - k.baseWidth / 2, height);
        for (let s = 1; s <= k.segments; s++) {
          const sway = Math.sin(time * k.speed + k.phase + s * 0.35) * (s * 2.2);
          const currentY = height - s * segLen;
          const currentWidth = k.baseWidth * (1 - s / (k.segments * 1.25));
          ctx.lineTo(k.x + sway - currentWidth / 2, currentY);
        }
        const tipSway = Math.sin(time * k.speed + k.phase + k.segments * 0.35) * (k.segments * 2.2);
        ctx.lineTo(k.x + tipSway, height - k.height);
        for (let s = k.segments; s >= 1; s--) {
          const sway = Math.sin(time * k.speed + k.phase + s * 0.35) * (s * 2.2);
          const currentY = height - s * segLen;
          const currentWidth = k.baseWidth * (1 - s / (k.segments * 1.25));
          ctx.lineTo(k.x + sway - currentWidth / 2, currentY);
        }
        ctx.lineTo(k.x + k.baseWidth / 2, height);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });
    }

    function animate() {
      time += 1;
      drawBackground();
      drawGlints();
      drawJellies();
      drawBubbles();
      drawReducedKelp();
      requestAnimationFrame(animate);
    }

    initAllCanvas();
    animate();

    /* INVENTORY DYNAMIC LOGIC - ZERO HARDCODED DEFAULT ITEMS */
    function getFishProducts() {
      const raw = localStorage.getItem('exotic_gb_data_v4') || localStorage.getItem('exotic_gb_data') || localStorage.getItem('exotic_gb_data_v3') || '{}';
      const data = JSON.parse(raw);
      if (data.stocks && data.stocks.fish) {
        return data.stocks.fish.filter(f => f.isActive !== false);
      }
      return [];
    }

    const cardStates = {};

    function renderFishes(items) {
      const fishItems = items || getFishProducts();
      const container = document.getElementById('fishesContainer');

      if (!fishItems || fishItems.length === 0) {
        container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); font-weight: 700; font-size: 1.05rem; background: var(--glass-bg); border-radius: var(--card-radius); border: 2px dashed #cbd5e1;">No live fishes currently available. Check back soon!</div>`;
        return;
      }

      fishItems.forEach(p => {
        if (!cardStates[p.id]) cardStates[p.id] = { qty: 1, isPair: false };
      });

      container.innerHTML = fishItems.map(f => {
        const state = cardStates[f.id];
        const effectivePrice = state.isPair ? (f.pairPrice || f.price * 2) : f.price;
        return `
          <div class="product-card" id="card_${f.id}">
            <div class="product-img-wrapper">
              <span class="product-badge-float">${f.tag || 'Standard'}</span>
              <img src="${f.img || ''}" class="product-img" alt="${f.name}" />
            </div>
            <h3 class="product-name">${f.name}</h3>
            <div class="product-price-row">
              <span class="product-price" id="price_${f.id}">₹${effectivePrice.toLocaleString('en-IN')}</span>
              <span style="font-size:0.8rem; color:var(--text-muted);">${state.isPair ? 'Per Pair' : 'Per Piece'}</span>
            </div>
            <div class="controls-row">
              <button class="btn-pair ${state.isPair ? 'active' : ''}" onclick="togglePair('${f.id}')">
                <i class="fa-solid fa-venus-mars"></i> ${state.isPair ? 'Pair (M+F)' : 'Single (1pc)'}
              </button>
              <div class="qty-selector">
                <button class="qty-btn" onclick="changeQty('${f.id}', -1)">-</button>
                <span class="qty-val" id="qty_${f.id}">${state.qty}</span>
                <button class="qty-btn" onclick="changeQty('${f.id}', 1)">+</button>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn-card btn-add-cart" onclick="addToCart('${f.id}')">
                <i class="fa-solid fa-cart-plus"></i> Add Cart
              </button>
              <button class="btn-card btn-buy-now" onclick="buyNow('${f.id}')">Buy Now</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function togglePair(id) {
      const fishes = getFishProducts();
      const fish = fishes.find(f => f.id === id);
      if (!fish) return;
      cardStates[id].isPair = !cardStates[id].isPair;
      
      const priceEl = document.getElementById(`price_${id}`);
      const btnEl = document.querySelector(`#card_${id} .btn-pair`);
      const pairP = fish.pairPrice || fish.price * 2;
      const effective = cardStates[id].isPair ? pairP : fish.price;
      
      priceEl.innerText = `₹${effective.toLocaleString('en-IN')}`;
      btnEl.classList.toggle('active', cardStates[id].isPair);
      btnEl.innerHTML = `<i class="fa-solid fa-venus-mars"></i> ${cardStates[id].isPair ? 'Pair (M+F)' : 'Single (1pc)'}`;
    }

    function changeQty(id, delta) {
      if (cardStates[id].qty + delta >= 1) {
        cardStates[id].qty += delta;
        document.getElementById(`qty_${id}`).innerText = cardStates[id].qty;
      }
    }

    function addToCart(id) {
      const fishes = getFishProducts();
      const fish = fishes.find(f => f.id === id);
      if (!fish) return;
      const state = cardStates[id];
      const cart = JSON.parse(localStorage.getItem('exotic_cart') || '[]');

      const itemPrice = state.isPair ? (fish.pairPrice || fish.price * 2) : fish.price;
      const existingIdx = cart.findIndex(c => c.id === id && c.isPair === state.isPair);

      if (existingIdx > -1) {
        cart[existingIdx].quantity += state.qty;
      } else {
        cart.push({
          id: fish.id, name: fish.name, category: "Live Fishes",
          price: itemPrice, quantity: state.qty, isPair: state.isPair, img: fish.img
        });
      }

      localStorage.setItem('exotic_cart', JSON.stringify(cart));
      updateCartBadge();
      alert(`Added ${state.qty}x ${fish.name} ${state.isPair ? '(Pair)' : ''} to cart!`);
    }

    function buyNow(id) { addToCart(id); window.location.href = "cart.html"; }

    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem('exotic_cart') || '[]');
      document.getElementById('cartCountBadge').innerText = cart.reduce((a, b) => a + b.quantity, 0);
    }

    function renderNavProfile() {
      const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
      document.getElementById('profileContainer').innerHTML = user && user.name 
        ? `<div class="profile-avatar-logged-in">${user.name.charAt(0).toUpperCase()}</div>`
        : `<a href="login.html" class="profile-icon-logged-out"><i class="fa-regular fa-user"></i></a>`;
    }

    function searchFishes(keyword) {
      const fishes = getFishProducts();
      const filtered = fishes.filter(f => f.name.toLowerCase().includes(keyword.toLowerCase()));
      renderFishes(filtered);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderNavProfile();
      renderFishes();
      updateCartBadge();
    });
  </script>
</body>
</html>
